# Site Info
title: Openafox
tagline: "Austin Fox's personal website."
description: 'A place for Austin to collect his thoughts and share them with the world.'

baseurl: ""
url: https://openafox.com
logo: '/public/logo.png'

# Images
images: "/resources/img"

# Site configurations
plugins:
  - jekyll-paginate
markdown: kramdown
kramdown:
  input: GFM
exclude: [README.md, CLAUDE.md, serve.sh, LICENSE.md]
excerpt_separator: "<!-- more -->"
sass:
  style: compressed
  sass_dir: _scss    
paginate: 5
paginate_path: '/blog/page:num'
permalink: none #/:categories/:title.html

version: 1.0.0

# About/contact
author: 
  name: Austin Fox
  description: Standing on the shoulders of <strong>Giants</strong>.
  gravatar: 8380dfa3bae72c296b4098892df3c1a0 # md5 hash of your email address
  contact:
    linkedin:  https://www.linkedin.com/in/openafox
    github:    https://github.com/openafox
    # facebook:  <hide>
    twitter:   https://twitter.com/openafox
    email:     mailto:openafox@gmail.com

# Navigation (2nd level links supported)
nav:
  Home:           
    - '/'
  Blog:           
    - '/blog/'
    - { Categories: '/blog/categories' }
    - { Tags: '/blog/tags' }
  About:          
    - '/about'
  GitHub Project Pages:          
    - '/projects'

# Where are tags and categories displayed
tag_page: '/blog/tags'
category_page: '/blog/categories'

# Puglins
mathjax: true # whether to load MathJax 3
google_analytics_token: G-7MPBRL84D0 # GA4 measurement ID (G-XXXXXXXXXX); blank disables analytics. Old UA- IDs stopped working in 2023
# Comments via giscus (GitHub Discussions); see README. Leave repo_id blank to disable.
giscus:
  repo: openafox/openafox.github.io
  repo_id: # R_... from https://giscus.app
  category: Comments
  category_id: # DIC_... from https://giscus.app

